name: Force Reinstall — Uninstall & Install

on:
  workflow_dispatch:
    inputs:
      subreddit:
        description: 'Subreddit to fully uninstall and reinstall the app on'
        required: true
        default: 'ItaliaCareerAdvice'

jobs:
  reinstall:
    name: Uninstall then install (forces fresh trigger subscription)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Uninstall from target subreddit
        run: npx devvit-cli uninstall "${{ github.event.inputs.subreddit }}"
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}

      - name: Reinstall on target subreddit
        run: npx devvit-cli install "${{ github.event.inputs.subreddit }}"
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
