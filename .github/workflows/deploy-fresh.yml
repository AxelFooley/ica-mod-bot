name: Deploy Fresh — Publish, Uninstall, Reinstall

on:
  workflow_dispatch:
    inputs:
      subreddit:
        description: 'Subreddit to publish a new version to and fully reinstall on'
        required: true
        default: 'ItaliaCareerAdvice'

jobs:
  deploy:
    name: Publish then force a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish new version (unlisted)
        run: npx devvit-cli publish --bump patch
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_ALLOW_SOURCE_UPLOAD: '1'

      - name: Uninstall from target subreddit
        run: npx devvit-cli uninstall "${{ github.event.inputs.subreddit }}"
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}

      - name: Fresh install on target subreddit
        run: npx devvit-cli install "${{ github.event.inputs.subreddit }}"
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
